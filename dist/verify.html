<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pedalboard JS · Audio verification</title><link rel="stylesheet" href="style.css"></head><body><main class="guide"><a href="index.html">← Pedalboard</a><h1>Audio verification</h1><p>Real Web Audio offline rendering. No microphone access or audible output.</p><button id="run" class="dark-button">Run audio checks</button><pre id="result" role="status">Ready.</pre><script type="module">
import{Pedalboard,createEffect,EFFECTS}from'./src/pedalboard.js';const log=document.querySelector('#result');let failures=0;function assert(ok,s){if(!ok)throw new Error(s);}async function run(name,fn){try{await fn();log.textContent+='PASS '+name+'\n';}catch(e){failures++;log.textContent+='FAIL '+name+': '+e.message+'\n';}}
document.querySelector('#run').onclick=async()=>{document.querySelector('#run').disabled=true;log.textContent='';failures=0;for(const type of Object.keys(EFFECTS))await run(type+' renders finite, non-silent audio',async()=>{const c=new OfflineAudioContext(2,48000,48000),fx=await createEffect(c,type),o=c.createOscillator(),g=c.createGain();o.frequency.value=220;g.gain.value=.1;o.connect(g).connect(fx.input);fx.output.connect(c.destination);o.start();const a=(await c.startRendering()).getChannelData(0);assert(a.every(Number.isFinite),'non-finite');assert(a.some(v=>Math.abs(v)>.001),'silent');fx.dispose();});
await run('board reorder, preset round-trip and global dry bypass',async()=>{const c=new OfflineAudioContext(1,24000,48000),b=await Pedalboard.create(c);b.setOrder([...b.order].reverse());b.applyPreset(JSON.parse(JSON.stringify(b.serialize())));assert(b.order[0]==='cabinet','order');b.setBypassed(true);const o=c.createOscillator(),g=c.createGain();o.frequency.value=440;g.gain.value=.1;o.connect(g).connect(b.input);b.output.connect(c.destination);o.start();const a=(await c.startRendering()).getChannelData(0);let sum=0;for(let i=10000;i<20000;i++)sum+=Math.abs(a[i]-.1*Math.sin(2*Math.PI*440*i/48000));assert(sum/10000<.0001,'not dry');b.dispose();});
await run('delay produces timed repeat',async()=>{const c=new OfflineAudioContext(1,48000,48000),f=await createEffect(c,'delay',{params:{time:100,feedback:0,mix:100,tone:10000}}),s=c.createBufferSource(),b=c.createBuffer(1,48000,48000);b.getChannelData(0)[12000]=1;s.buffer=b;s.connect(f.input);f.output.connect(c.destination);s.start();const a=(await c.startRendering()).getChannelData(0),peak=a.reduce((best,v,i)=>Math.abs(v)>Math.abs(a[best])?i:best,0);assert(Math.abs(peak-16800)<100,'wrong delay: '+peak);f.dispose();});
await run('custom WAV IR decodes and passes audio',async()=>{const c=new OfflineAudioContext(1,24000,48000),f=await createEffect(c,'cabinet'),n=256,b=new ArrayBuffer(44+n*2),v=new DataView(b);function text(at,s){for(let i=0;i<s.length;i++)v.setUint8(at+i,s.charCodeAt(i));}text(0,'RIFF');v.setUint32(4,36+n*2,true);text(8,'WAVE');text(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,48000,true);v.setUint32(28,96000,true);v.setUint16(32,2,true);v.setUint16(34,16,true);text(36,'data');v.setUint32(40,n*2,true);v.setInt16(44,32767,true);await f.loadIR(b,{name:'Unit impulse',id:'test'});assert(f.irName==='Unit impulse','IR name');const o=c.createOscillator();o.connect(f.input);f.output.connect(c.destination);o.start();const a=(await c.startRendering()).getChannelData(0);assert(a.some(x=>Math.abs(x)>.1),'silent IR');f.dispose();});log.textContent+='\n'+(failures?failures+' checks failed.':'All 11 audio checks passed.');document.querySelector('#run').disabled=false;};
</script></main></body></html>
